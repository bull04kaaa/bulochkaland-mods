
name: Update manifest.json

on:
  workflow_dispatch:
  release:
    types: [published, edited, released]

# Не допускаем одновременное выполнение обновлений
concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Получаем основную ветку репозитория
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Генерируем manifest.json из релиза v1
      - name: Generate manifest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import json, subprocess, os, sys

          repo = os.environ["REPO"]

          # Получаем assets релиза v1
          result = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{repo}/releases/tags/v1",
                  "--jq",
                  "[.assets[] | {name: .name, url: .browser_download_url}]"
              ],
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              print("Ошибка получения релиза:")
              print(result.stderr)
              sys.exit(1)

          assets = json.loads(result.stdout)

          # Читаем текущий manifest
          with open("manifest.json", "r", encoding="utf-8") as f:
              current = json.load(f)

          # Формируем список модов
          mods = []

          for asset in assets:
              name = asset["name"]

              if not name.endswith(".jar"):
                  continue

              if name.endswith("-sources.jar"):
                  continue

              base = name[:-4]
              parts = base.split("-")
              mod_id = parts[0].lower()

              mods.append({
                  "id": mod_id,
                  "filename": name,
                  "url": asset["url"],
                  "sha256": ""
              })

          # Сортировка модов
          mods.sort(key=lambda x: x["filename"].lower())

          # Создание нового manifest
          new_manifest = {
              "mc_version": current.get("mc_version", "1.20.4"),
              "mods": mods,
              "resourcepacks": current.get("resourcepacks", []),
              "configs": current.get("configs", [])
          }

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(
                  new_manifest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print(f"Manifest обновлён: {len(mods)} модов")
          EOF

      # 3. Сохраняем и отправляем изменения
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifest.json

          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi

          git commit -m "Auto-update manifest.json [skip ci]"

          git pull --rebase origin main

          git push origin HEAD:main
