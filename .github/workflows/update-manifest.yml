name: Update manifest.json

on:
  workflow_dispatch:  # запуск вручную кнопкой на GitHub
  release:
    types: [published, edited, released]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manifest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import json, subprocess, os

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          # Получаем все assets из релиза v1
          result = subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/tags/v1", "--jq", ".assets[]"],
              capture_output=True, text=True
          )

          # Читаем текущий manifest чтобы сохранить resourcepacks и configs
          with open("manifest.json", "r", encoding="utf-8") as f:
              current = json.load(f)

          # Получаем полный список assets
          result = subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/tags/v1", "--jq",
               "[.assets[] | {name: .name, url: .browser_download_url}]"],
              capture_output=True, text=True
          )
          assets = json.loads(result.stdout)

          # Фильтруем только .jar файлы, исключая -sources.jar
          mods = []
          for asset in assets:
              name = asset["name"]
              if not name.endswith(".jar"):
                  continue
              if name.endswith("-sources.jar"):
                  continue

              # id — имя файла без версии и расширения (первая часть до первой цифры)
              base = name.replace(".jar", "")
              parts = base.split("-")
              mod_id = parts[0].lower()

              mods.append({
                  "id": mod_id,
                  "filename": name,
                  "url": asset["url"],
                  "sha256": ""
              })

          # Сортируем по filename
          mods.sort(key=lambda x: x["filename"].lower())

          # Собираем новый manifest
          new_manifest = {
              "mc_version": current.get("mc_version", "1.20.4"),
              "mods": mods,
              "resourcepacks": current.get("resourcepacks", []),
              "configs": current.get("configs", [])
          }

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(new_manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"✓ manifest.json обновлён: {len(mods)} модов")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "Нет изменений" || \
            git commit -m "Auto-update manifest.json [skip ci]" && git push
